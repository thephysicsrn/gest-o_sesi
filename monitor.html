<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#1e40af">
    <link rel="manifest" href="manifest.json">
    <title>Monitor Global - SESI Escola</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <style>
        .feed-container {
            display: flex;
            flex-direction: column;
            gap: 1rem;
            max-width: 800px;
            margin: 0 auto;
        }
        .feed-item {
            display: flex;
            align-items: center;
            gap: 1.5rem;
            background: white;
            padding: 1.25rem;
            border-radius: 16px;
            border-left: 6px solid var(--primary);
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
            animation: slideRight 0.4s ease-out;
        }
        .feed-time {
            font-family: monospace;
            font-weight: 700;
            color: var(--text-muted);
            min-width: 60px;
        }
        .feed-icon {
            font-size: 1.5rem;
            width: 40px;
            text-align: center;
        }
        .feed-content {
            flex: 1;
        }
        .feed-type {
            font-size: 0.7rem;
            text-transform: uppercase;
            font-weight: 700;
            letter-spacing: 0.05em;
            margin-bottom: 0.25rem;
        }
        .type-sala { color: #3b82f6; }
        .type-chaves { color: #f59e0b; }
        .type-pedagogico { color: #10b981; }
        .type-saida { color: #8b5cf6; }

        @keyframes slideRight {
            from { transform: translateX(-20px); opacity: 0; }
            to { transform: translateX(0); opacity: 1; }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <div class="logo-container">
                <img src="logo_sesi.png" alt="SESI Escola" class="school-logo">
            </div>
            <div class="header-top nav-group">
                <a href="index.html" class="nav-link">🏠 Início</a>
                <button id="btn-export-master" class="btn-action" style="background: var(--primary); color: white; border: none;">📥 Exportar Tudo (Excel)</button>
            </div>
            <h1>Monitor global</h1>
            <p>Feed em tempo real de todas as movimentações da unidade</p>
        </header>

        <main>
            <div id="global-feed" class="feed-container">
                <!-- Preenchido via JS -->
                <p class="empty-msg">Aguardando movimentações...</p>
            </div>
        </main>
    </div>

    <footer>
        <p>Desenvolvedor Mateus Zeca</p>
    </footer>

    <!-- Biblioteca Excel e Firebase -->
    <script src="https://cdn.sheetjs.com/xlsx-0.20.1/package/dist/xlsx.full.min.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-database-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
    <script src="app.js"></script>
</body>
</html>
