<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#1e40af">
    <link rel="manifest" href="manifest.json">
    <title>Gestão de chaves - Recepção</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="container">
        <header>
            <div class="logo-container">
                <img src="logo_sesi.png" alt="SESI Escola" class="school-logo">
            </div>
            <div class="header-top nav-group">
                <a href="index.html" class="nav-link">🏠 Início</a>
                <a href="banheiro.html" class="nav-link">← Voltar para Sala</a>
            </div>
            <h1>Gestão de chaves</h1>
            <p>Controle de retirada e devolução de chaves</p>
        </header>

        <main class="management-grid">
            <!-- Coluna Esquerda: Cadastro -->
            <section class="card glass">
                <h2><span class="icon">🔑</span> Registrar retirada</h2>
                <div class="form-group">
                    <label>Professor(a)</label>
                    <input type="text" id="prof-name" placeholder="Nome do Professor">

                    <label>Chave do Local</label>
                    <select id="key-select">
                        <option value="" disabled selected>Selecione o local</option>
                        <option value="Laboratório de informática">Laboratório de informática</option>
                        <option value="Arena de robótica">Arena de robótica</option>
                        <option value="Laboratório interdisciplinar">Laboratório interdisciplinar</option>
                        <option value="Outra...">Outra...</option>
                    </select>

                    <button id="btn-take-key" class="btn-primary" style="width: 100%; margin-top: 1rem;" onclick="takeKey()">Registrar
                        Retirada</button>
                </div>
            </section>

            <!-- Coluna Direita: Status Atual e Histórico -->
            <div class="main-content-chaves" style="grid-column: span 2;">
                <section class="card glass">
                    <h2><span class="icon">🏢</span> Chaves em Uso</h2>
                    <div id="active-keys-list" class="list-container">
                        <!-- Preenchido via JS -->
                        <p class="empty-msg">Todas as chaves estão na recepção</p>
                    </div>
                </section>

                <section class="card glass" style="margin-top: 1.5rem;">
                    <h2><span class="icon">📜</span> Histórico Recente</h2>
                    <div class="table-container">
                        <table class="history-table">
                            <thead>
                                <tr>
                                    <th>Local</th>
                                    <th>Professor</th>
                                    <th>Retirada</th>
                                    <th>Devolução</th>
                                    <th>Data</th>
                                </tr>
                            </thead>
                            <tbody id="keys-history-list">
                                <!-- Preenchido via JS -->
                            </tbody>
                        </table>
                    </div>
                </section>
            </div>
        </main>
    </div>

    <footer>
        <p>Desenvolvedor Mateus Zeca</p>
    </footer>

    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-database-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
    <script src="app.js"></script>
</body>

</html>
