<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#1e40af">
    <link rel="manifest" href="manifest.json">
    <title>Painel TI - SESI Gestão</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <style>
        .ti-grid {
            display: grid;
            grid-template-columns: 1fr 1.2fr 1fr;
            gap: 2rem;
            align-items: start;
            margin-top: 2rem;
        }
        .ti-column {
            display: flex;
            flex-direction: column;
            gap: 1rem;
            min-height: 70vh;
            padding-right: 1rem;
        }
        .ti-column:not(:last-child) {
            border-right: 1px solid rgba(203, 213, 225, 0.5);
        }
        .ti-card {
            background: white;
            padding: 1.25rem;
            border-radius: 16px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
            border-left: 5px solid var(--primary);
            position: relative;
            transition: transform 0.2s;
        }
        .ti-card:hover { transform: translateY(-3px); }
        .ti-card h3 { font-size: 1.1rem; margin-bottom: 0.5rem; color: var(--primary); }
        .ti-card p { font-size: 0.9rem; color: var(--text-muted); margin-bottom: 1rem; }
        .ti-card .meta { font-size: 0.75rem; color: #94a3b8; display: flex; justify-content: space-between; }
        .ti-actions { display: flex; gap: 0.5rem; margin-top: 1rem; }
        
        .status-aberto { border-left-color: var(--warning); }
        .status-atendimento { border-left-color: var(--primary); }
        .status-finalizado { border-left-color: var(--success); opacity: 0.8; }
        
        /* Cores baseadas no tempo */
        .time-green { border-left-color: #10b981 !important; background: rgba(16, 185, 129, 0.05); }
        .time-yellow { border-left-color: #f59e0b !important; background: rgba(245, 158, 11, 0.05); }
        .time-red { 
            border-left-color: #ef4444 !important; 
            background: rgba(239, 68, 68, 0.08);
            animation: pulse-red 1.5s infinite;
        }

        @keyframes pulse-red {
            0% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0.4); }
            70% { box-shadow: 0 0 0 10px rgba(239, 68, 68, 0); }
            100% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0); }
        }

        .time-elapsed {
            font-weight: 700;
            padding: 2px 8px;
            border-radius: 4px;
            font-size: 0.7rem;
        }
        .elapsed-green { color: #059669; background: #ecfdf5; }
        .elapsed-yellow { color: #d97706; background: #fffbeb; }
        .elapsed-red { color: #dc2626; background: #fef2f2; }
        
        .column-header {
            display: flex;
            align-items: center;
            gap: 0.75rem;
            margin-bottom: 1.5rem;
            padding: 0.5rem;
            border-bottom: 2px solid rgba(203, 213, 225, 0.4);
            padding-bottom: 1rem;
        }
        .column-header h2 { font-size: 0.9rem; text-transform: uppercase; letter-spacing: 0.1em; font-weight: 800; color: #475569; }
        .column-count { background: var(--secondary); color: var(--primary); padding: 0.2rem 0.6rem; border-radius: 50px; font-size: 0.8rem; font-weight: 700; }

        @media (max-width: 1024px) {
            .ti-grid { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>
    <div class="container" style="max-width: 1400px;">
        <header>
            <div class="logo-container">
                <img src="logo_sesi.png" alt="SESI Escola" class="school-logo">
            </div>
            <div class="header-top nav-group">
                <a href="index.html" class="nav-link">🏠 Início</a>
                <button id="btn-clear-ti" class="btn-danger-outline" style="font-size: 0.75rem;">Limpar Histórico</button>
            </div>
            <h1>Painel de chamados TI</h1>
            <p>Gerenciamento centralizado de suporte técnico às salas</p>
        </header>

        <main class="ti-grid">
            <!-- Coluna Esquerda: Em Atendimento -->
            <div class="ti-column">
                <div class="column-header">
                    <h2>Em Atendimento</h2>
                    <span class="column-count" id="count-atendimento">0</span>
                </div>
                <div id="list-atendimento" class="list-container">
                    <!-- JS -->
                </div>
            </div>

            <!-- Coluna Meio: Em Aberto -->
            <div class="ti-column">
                <div class="column-header">
                    <h2>Em Aberto</h2>
                    <span class="column-count" id="count-aberto">0</span>
                </div>
                <div id="list-aberto" class="list-container">
                    <!-- JS -->
                </div>
            </div>

            <!-- Coluna Direita: Finalizado -->
            <div class="ti-column">
                <div class="column-header">
                    <h2>Finalizado</h2>
                    <span class="column-count" id="count-finalizado">0</span>
                </div>
                <div id="list-finalizado" class="list-container">
                    <!-- JS -->
                </div>
            </div>
        </main>
    </div>

    <footer>
        <p>Desenvolvedor Mateus Zeca</p>
    </footer>

    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-database-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
    <script src="app.js"></script>
</body>
</html>
